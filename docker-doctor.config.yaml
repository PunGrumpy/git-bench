# yaml-language-server: $schema=https://docker-doctor.vercel.app/schema.json

# This image is a single-shot benchmark runner: it builds the five git runners,
# executes them once, writes results.json to a mounted volume, and exits. A few
# rules assume a long-lived service image and do not apply here.
rules:
  # scripts/docker-entrypoint.sh chowns results.json to the host uid/gid so the
  # mounted volume does not fill with root-owned files. That needs root.
  docker-doctor/no-root-user: "off"

  # ENTRYPOINT runs to completion and exits; there is no port, no daemon, and
  # nothing for Docker to poll.
  docker-doctor/require-healthcheck: "off"
