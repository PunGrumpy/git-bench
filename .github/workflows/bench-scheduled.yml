name: Scheduled benchmark refresh

on:
  schedule:
    # Mondays 03:00 UTC (10:00 Asia/Bangkok)
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Record runner hardware
        id: hw
        run: |
          lscpu | tee runner-info.txt
          model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          echo "cpu=$model" >> "$GITHUB_OUTPUT"
          echo "prev_cpu=$(jq -r '.environment.cpu // "unrecorded"' packages/bench/results.json)" >> "$GITHUB_OUTPUT"
          echo "prev_bun=$(jq -r '.environment.bun // "unrecorded"' packages/bench/results.json)" >> "$GITHUB_OUTPUT"

      - name: Run benchmark in Docker
        run: bash scripts/docker-bench.sh 2>&1 | tee bench-output.txt

      - name: Record environment into results
        id: env
        run: |
          # `+=`, not `=`: the benchmark already wrote `bun` into `.environment`.
          jq --arg cpu "${{ steps.hw.outputs.cpu }}" \
            '.environment += {cpu: $cpu, source: "github-actions"}' \
            packages/bench/results.json > results.tmp
          mv results.tmp packages/bench/results.json
          echo "bun=$(jq -r '.environment.bun // "unrecorded"' packages/bench/results.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: bench-results-${{ github.run_id }}
          path: |
            packages/bench/results.json
            runner-info.txt
            bench-output.txt

      - name: Open results PR
        env:
          GH_TOKEN: ${{ github.token }}
          CPU: ${{ steps.hw.outputs.cpu }}
          PREV_CPU: ${{ steps.hw.outputs.prev_cpu }}
          BUN: ${{ steps.env.outputs.bun }}
          PREV_BUN: ${{ steps.hw.outputs.prev_bun }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git diff --quiet packages/bench/results.json; then
            echo "results.json unchanged; nothing to publish."
            exit 0
          fi
          stamp=$(date -u +%Y-%m-%d)
          branch="bench-results/$stamp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/bench/results.json
          git commit -m "chore(bench): weekly results refresh ($stamp)"
          git push -u origin "$branch" --force

          verdict() {
            if [ "$2" = "unrecorded" ]; then
              printf '🆕 first snapshot recording this'
            elif [ "$1" = "$2" ]; then
              printf '✅ unchanged — comparable with the previous snapshot'
            else
              printf '%s' "$3"
            fi
          }
          cpu_compare=$(verdict "$CPU" "$PREV_CPU" \
            '⚠️ different model — compare rankings, not milliseconds')
          bun_compare=$(verdict "$BUN" "$PREV_BUN" \
            '⚠️ different runtime — `libgit2-ffi` and `isomorphic-git` milliseconds are not comparable')

          {
            printf '| Environment | Current | Previous | Comparability |\n'
            printf '| --- | --- | --- | --- |\n'
            printf '| CPU | `%s` | `%s` | %s |\n' "$CPU" "$PREV_CPU" "$cpu_compare"
            printf '| Bun | `%s` | `%s` | %s |\n' "$BUN" "$PREV_BUN" "$bun_compare"
            printf '\nSource: github-actions ([run](%s))\n\n' "$RUN_URL"
            if grep -q "PARITY MISMATCH" bench-output.txt; then
              printf '**Parity** — runner output differs from the `git` baseline:\n\n'
              printf '| Runner / operation | Observed | Baseline |\n| --- | --- | --- |\n'
              sed -n 's/^ *PARITY MISMATCH \([^:]*\): \(.*\) != \(.*\)$/| `\1` | \2 | \3 |/p' bench-output.txt
            else
              printf '**Parity** — ✅ all runners agree with the `git` baseline.\n'
            fi
            printf '\n'
            printf '> CI `verify` does not auto-run on bot PRs — close & reopen to trigger it.\n'
          } > pr-body.md

          gh pr create --base main --head "$branch" \
            --title "chore(bench): weekly results refresh $stamp" \
            --body-file pr-body.md
